<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Estadísticas de Emails — Organización Colaboradores</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --impulsa:#5b9bd5; --impulsa-lt:#eaf4fb; --impulsa-md:#47799f;
  --white:#fff; --bg:#e9edf5; --border:#dbe1eb;
  --text:#1e293b; --muted:#64748b; --card:#fff;
  --danger:#e74c3c;
  --shadow:0 2px 10px rgba(30,41,59,.09);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--text);}

.hdr{background:#1a2340;padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:60;box-shadow:0 2px 12px rgba(0,0,0,.2);}
.hdr-brand a{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
.hdr-logo{width:32px;height:32px;background:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--impulsa-md);font-style:italic;flex-shrink:0;}
.hdr-title{color:#fff;font-size:13.5px;font-weight:800;}
.hdr-sub{color:rgba(255,255,255,.5);font-size:10px;font-weight:500;}
.hdr-back{font-size:12px;color:rgba(255,255,255,.75);padding:7px 13px;border:1.5px solid rgba(255,255,255,.18);border-radius:8px;cursor:pointer;background:transparent;font-family:inherit;font-weight:700;text-decoration:none;transition:.15s;}
.hdr-back:hover{background:rgba(255,255,255,.1);color:#fff;}

.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 60px;}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;}
.toolbar h1{font-size:18px;font-weight:800;}
.toolbar-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.toolbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
select, input#search{padding:8px 11px;border:1px solid var(--border);border-radius:9px;font-family:inherit;font-size:12.5px;background:#fff;color:var(--text);}
select{font-weight:700;cursor:pointer;}
input#search{min-width:180px;}
.btn{padding:9px 15px;border:none;border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s;}
.btn-primary{background:var(--impulsa);color:#fff;}
.btn-primary:hover{background:var(--impulsa-md);}
.btn-ghost{background:#fff;color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--bg);}

.sync-badge{font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:20px;display:flex;align-items:center;gap:5px;}
.sync-badge.ok{background:#eaf9f3;color:#00966d;}
.sync-badge.saving{background:var(--impulsa-lt);color:var(--impulsa-md);}
.sync-badge.err{background:#fdeceb;color:var(--danger);}
.sync-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

.view-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.view-tab{padding:9px 16px;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer;background:#fff;border:1.5px solid var(--border);color:var(--muted);}
.view-tab.active{background:#1a2340;border-color:#1a2340;color:#fff;}

.month-tabs{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap;}
.month-tab{padding:6px 12px;border-radius:16px;font-size:11px;font-weight:700;cursor:pointer;background:#fff;border:1.5px solid var(--border);color:var(--muted);}
.month-tab:hover{border-color:var(--impulsa);color:var(--impulsa);}
.month-tab.active{background:var(--impulsa);border-color:var(--impulsa);color:#fff;}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.tab{padding:7px 13px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;background:#fff;border:1.5px solid var(--border);color:var(--muted);white-space:nowrap;}
.tab:hover{border-color:var(--impulsa);color:var(--impulsa);}
.tab.active{background:var(--impulsa);border-color:var(--impulsa);color:#fff;}
.tab.total-tab{border-color:#00cd94;color:#00966d;}
.tab.total-tab.active{background:#00cd94;border-color:#00cd94;color:#fff;}

.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;margin-bottom:18px;}
.table-scroll{overflow-x:auto;}
table{border-collapse:collapse;width:100%;}
thead th{position:sticky;top:0;background:#f3f5fa;color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:8px 3px;text-align:center;border-bottom:2px solid var(--border);z-index:2;min-width:42px;}
thead th.th-name{text-align:left;padding-left:14px;min-width:190px;position:sticky;left:0;background:#f3f5fa;z-index:3;}
thead th.th-total{color:var(--impulsa-md);min-width:52px;}
tbody td{padding:0;border-bottom:1px solid var(--border);text-align:center;}
tbody tr:hover td{background:#fafbfd;}
td.td-name{text-align:left;padding:0 14px;font-size:11.5px;font-weight:700;color:var(--text);white-space:nowrap;position:sticky;left:0;background:#fff;z-index:1;border-right:1px solid var(--border);}
tr.fila-campana td{border-top:2px solid var(--impulsa-lt);}
td.td-name.indent-1{padding-left:26px;font-weight:600;color:var(--muted);font-size:11px;}
td.td-name.indent-2{padding-left:38px;font-weight:500;color:var(--muted);font-size:10.5px;font-style:italic;}
td.td-name .row-inner{display:flex;align-items:center;gap:6px;height:34px;}
td.td-name input{border:none;background:transparent;font-family:inherit;font-size:inherit;font-weight:inherit;color:inherit;width:100%;padding:2px 0;}
td.td-name input:focus{outline:none;background:var(--impulsa-lt);border-radius:5px;padding:2px 4px;}
td.td-del{width:26px;padding:0;}
td.td-del button{background:none;border:none;color:var(--muted);opacity:.3;cursor:pointer;font-size:11px;padding:6px;}
td.td-del button:hover{opacity:1;color:var(--danger);}
td.td-cell input{width:100%;height:34px;border:none;background:transparent;text-align:center;font-family:inherit;font-size:10.5px;color:var(--text);padding:0 1px;}
td.td-cell input:focus{outline:none;background:var(--impulsa-lt);box-shadow:inset 0 0 0 1.5px var(--impulsa);}
td.td-cell.readonly input{color:var(--muted);background:#fafbfd;cursor:default;}
td.td-rowtotal{font-weight:800;color:var(--impulsa-md);background:var(--impulsa-lt);font-size:11.5px;}
tfoot td{padding:8px 5px;font-weight:800;font-size:11px;background:#f3f5fa;border-top:2px solid var(--border);text-align:center;}
tfoot td.td-name{background:#f3f5fa;position:sticky;left:0;}
tfoot td.td-grandtotal{color:var(--impulsa-md);background:var(--impulsa-lt);}

.addrow-bar{padding:10px 14px;border-top:1px solid var(--border);}
.addrow-bar button{background:none;border:2px dashed var(--border);color:var(--muted);border-radius:9px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;padding:7px 14px;}
.addrow-bar button:hover{border-color:var(--impulsa);color:var(--impulsa);background:var(--impulsa-lt);}

.hint{font-size:11px;color:var(--muted);margin:10px 2px 0;line-height:1.5;}
.save-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2340;color:#fff;padding:10px 20px;border-radius:10px;font-size:12.5px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.25s;z-index:100;}
.save-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

td.td-cell.clickable{cursor:pointer;}
td.td-cell.clickable:hover{background:var(--impulsa-lt);}
td.td-cell.clickable input{cursor:pointer;}

.bd-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.bd-overlay.show{display:flex;}
.bd-box{background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.3);width:100%;max-width:340px;overflow:hidden;}
.bd-head{background:#1a2340;padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.bd-head h3{color:#fff;font-size:12.5px;font-weight:800;line-height:1.35;}
.bd-close{background:rgba(255,255,255,.12);border:none;color:#fff;width:24px;height:24px;border-radius:7px;cursor:pointer;font-size:13px;flex-shrink:0;}
.bd-close:hover{background:rgba(255,255,255,.25);}
.bd-body{padding:12px 18px;max-height:50vh;overflow-y:auto;}
.bd-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;}
.bd-row:last-child{border-bottom:none;}
.bd-row span:first-child{color:var(--text);font-weight:600;}
.bd-row span:last-child{font-weight:800;color:var(--impulsa-md);}
.bd-row.bd-zero span{color:var(--muted);font-weight:500;}
.bd-foot{padding:12px 18px;border-top:2px solid var(--border);background:var(--impulsa-lt);font-weight:800;font-size:13px;color:var(--impulsa-md);text-align:right;}

@media(max-width:700px){ .toolbar{flex-direction:column;align-items:stretch;} }
</style>
</head>

  <div id="month-tabs-wrap" class="month-tabs"></div>

  <div class="card">

  </div>

  <div class="hint" id="hint"></div>

</div>

<div class="save-toast" id="toast">Guardado ✅</div>

<div class="bd-overlay" id="breakdown-modal" onclick="if(event.target===this) closeBreakdown()">
  <div class="bd-box">
    <div class="bd-head">

      <button type="button" class="bd-close" onclick="closeBreakdown()">×</button>
    </div>
    <div class="bd-body" id="bd-body"></div>
    <div class="bd-foot" id="bd-total"></div>
  </div>
</div>

function setSyncBadge(state) {
  const el = document.getElementById('sync-badge');
  const txt = document.getElementById('sync-badge-text');
  if (!el || !txt) return;
  el.className = 'sync-badge ' + state;
  if (state === 'ok') txt.textContent = 'Sincronizado';
  else if (state === 'saving') txt.textContent = 'Guardando...';
  else txt.textContent = 'Sin conexión (local)';
}

async function pushCampanaRow(year, month, rowKey) {
  if (!sb) return;
  setSyncBadge('saving');
  const valores = campanasData[year][month][rowKey];
  const { error } = await sb.from('campanas_mensual').upsert(
    { year: parseInt(year), month, row_key: rowKey, valores, updated_at: new Date().toISOString() },
    { onConflict: 'year,month,row_key' }
  );
  setSyncBadge(error ? 'err' : 'ok');
  if (error) console.error('Supabase (campana):', error);
}

async function pushAuxRow(year, month, categoria, auxiliar) {
  if (!sb) return;
  setSyncBadge('saving');
  const valores = auxData[year][month][categoria][auxiliar];
  const { error } = await sb.from('aux_mensual').upsert(
    { year: parseInt(year), month, categoria, auxiliar, valores, updated_at: new Date().toISOString() },
    { onConflict: 'year,month,categoria,auxiliar' }
  );

// Corré esta función UNA SOLA VEZ (desde la consola del navegador: sembrarSupabase())
// después de crear las tablas, para subir todo lo que ya tenés cargado en este navegador
// (seed + lo que hayas tocado localmente) a Supabase. Después de eso, la app ya sincroniza sola.
// Sube todo en tandas grandes (no fila por fila) para que sea rápido incluso con miles de registros.
async function sembrarSupabase() {
  if (!sb) { alert('Falta configurar SUPABASE_URL y SUPABASE_ANON_KEY arriba en el código.'); return; }
  if (!confirm('Esto va a subir TODOS los datos actuales (campañas + auxiliares + roster + años) a Supabase, sobrescribiendo lo que haya ahí. ¿Continuar?')) return;
  setSyncBadge('saving');

  const camp = [];
  for (const year of Object.keys(campanasData)) {
    for (const month of Object.keys(campanasData[year])) {
      for (const rowKey of Object.keys(campanasData[year][month])) {
        camp.push({ year: parseInt(year), month: parseInt(month), row_key: rowKey, valores: campanasData[year][month][rowKey], updated_at: new Date().toISOString() });
      }
    }
  }
  const aux = [];
  for (const year of Object.keys(auxData)) {
    for (const month of Object.keys(auxData[year])) {
      for (const cat of Object.keys(auxData[year][month])) {
        for (const nombre of Object.keys(auxData[year][month][cat])) {
          aux.push({ year: parseInt(year), month: parseInt(month), categoria: cat, auxiliar: nombre, valores: auxData[year][month][cat][nombre], updated_at: new Date().toISOString() });
        }
      }
    }
  }

  let fail = 0;
  async function subirEnTandas(tabla, filas, onConflict) {
    for (let i = 0; i < filas.length; i += 500) {
      const tanda = filas.slice(i, i + 500);
      const { error } = await sb.from(tabla).upsert(tanda, { onConflict });
      if (error) { fail++; console.error(tabla, error); }
    }
  }
  await subirEnTandas('campanas_mensual', camp, 'year,month,row_key');
  await subirEnTandas('aux_mensual', aux, 'year,month,categoria,auxiliar');
  await pushMeta('roster', roster);
  await pushMeta('years', years);

  setSyncBadge(fail ? 'err' : 'ok');
  alert(`Listo. ${camp.length} filas de campañas + ${aux.length} de auxiliares subidas${fail ? ` (con ${fail} tandas con error, revisá la consola)` : ''}.`);
}

async function loadAllFromSupabase() {

      nuevaCampanas[r.year] ??= {};
      nuevaCampanas[r.year][r.month] ??= {};
      nuevaCampanas[r.year][r.month][r.row_key] = r.valores;
    });
    const nuevaAux = {};
    (auxRows || []).forEach(r => {
      nuevaAux[r.year] ??= {};
      nuevaAux[r.year][r.month] ??= {};
      nuevaAux[r.year][r.month][r.categoria] ??= {};
      nuevaAux[r.year][r.month][r.categoria][r.auxiliar] = r.valores;
    });
    const metaRoster = (metaRows || []).find(m => m.key === 'roster');
    const metaYears = (metaRows || []).find(m => m.key === 'years');

    // Si Supabase todavía está vacío (primera vez), lo poblamos con lo que haya local/seed y no pisamos nada.
    if (!campRows.length && !auxRows.length) {
      setSyncBadge('ok');
      return false; // deja que arranque desde localStorage/seed, y luego se puede "sembrar" manualmente si hace falta
    }

    campanasData = nuevaCampanas;
    auxData = nuevaAux;
    if (metaRoster) roster = metaRoster.value;
    if (metaYears) years = metaYears.value;
    saveAllToStorage(); // deja una copia local como caché/respaldo offline
    setSyncBadge('ok');
    return true;
  } catch (err) {
    console.error('Error cargando desde Supabase, uso caché local:', err);
    setSyncBadge('err');
    return false;
  }
}

let view = 'campanas';
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let currentCat = CATEGORIAS[0].id;

function diasEnMes(year, monthIdx) { return new Date(year, monthIdx+1, 0).getDate(); }

function loadJSON(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v || fallback; } catch(e) { return fallback; }
}
let campanasData = loadJSON(K_CAMPANAS, null) || JSON.parse(JSON.stringify(SEED_CAMPANAS));
let auxData      = loadJSON(K_AUX, null) || JSON.parse(JSON.stringify(SEED_AUX));
let roster       = loadJSON(K_ROSTER, null) || ROSTER_INICIAL.slice();
let years        = loadJSON(K_YEARS, null) || [currentYear];
if (!loadJSON(K_ROSTER, null)) localStorage.setItem(K_ROSTER, JSON.stringify(roster));
if (!loadJSON(K_YEARS, null)) localStorage.setItem(K_YEARS, JSON.stringify(years));

function saveAllToStorage() {
  localStorage.setItem(K_CAMPANAS, JSON.stringify(campanasData));
  localStorage.setItem(K_AUX, JSON.stringify(auxData));
  localStorage.setItem(K_ROSTER, JSON.stringify(roster));
  localStorage.setItem(K_YEARS, JSON.stringify(years));
}

function ensureCampanasMonth(year, month) {
  const nd = diasEnMes(year, month);
  if (!campanasData[year]) campanasData[year] = {};
  if (!campanasData[year][month]) campanasData[year][month] = {};
  FILAS_CAMPANAS.forEach(f => {
    const arr = campanasData[year][month][f.key];
    if (!arr) campanasData[year][month][f.key] = new Array(nd).fill(0);
    else if (arr.length !== nd) { arr.length = nd; for (let i=0;i<nd;i++) if (arr[i]==null) arr[i]=0; }
  });
  return campanasData[year][month];
}
function ensureAuxMonth(year, month, cat) {
  const nd = diasEnMes(year, month);
  if (!auxData[year]) auxData[year] = {};
  if (!auxData[year][month]) auxData[year][month] = {};
  if (!auxData[year][month][cat]) auxData[year][month][cat] = {};
  const catData = auxData[year][month][cat];
  roster.forEach(n => {
    const arr = catData[n];
    if (!arr) catData[n] = new Array(nd).fill(0);
    else if (arr.length !== nd) { arr.length = nd; for (let i=0;i<nd;i++) if (arr[i]==null) arr[i]=0; }
  });
  return catData;
}
function sumArr(a){ return (a||[]).reduce((s,v)=>s+(parseInt(v)||0),0); }

function renderYearSelect() {
  const sel = document.getElementById('year');
  sel.innerHTML = years.map(y=>`<option value="${y}" ${y===currentYear?'selected':''}>${y}</option>`).join('')
    + `<option value="__nuevo">+ Agregar año...</option>`;
}
function onYearChange() {
  const sel = document.getElementById('year');
  if (sel.value === '__nuevo') {
    const y = parseInt(prompt('¿Qué año querés agregar?', Math.max(...years)+1));
    if (y && !years.includes(y)) { years.push(y); years.sort(); saveAllToStorage(); pushMeta('years', years); }
    renderYearSelect();
    render();
    return;
  }
  currentYear = parseInt(sel.value);
  render();
}
function setView(v) { view = v; render(); }
function setMonth(m) { currentMonth = m; render(); }
function setCat(id) { currentCat = id; render(); }

function renderViewTabs() {
  document.querySelectorAll('.view-tab').forEach(el => el.classList.toggle('active', el.dataset.view === view));
}
function renderMonthTabs() {
  const wrap = document.getElementById('month-tabs-wrap');
  if (view === 'anual') { wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  wrap.innerHTML = MESES.map((m,i)=>`<div class="month-tab ${i===currentMonth?'active':''}" onclick="setMonth(${i})">${m}</div>`).join('');
}
function renderCatTabs() {
  const wrap = document.getElementById('cat-tabs-wrap');
  if (view === 'campanas') { wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  wrap.innerHTML = CATEGORIAS.map(c=>`<div class="tab ${c.id===currentCat?'active':''}" onclick="setCat('${c.id}')">${c.icon} ${c.label}</div>`).join('')
    + `<div class="tab total-tab ${currentCat==='__total'?'active':''}" onclick="setCat('__total')">🟢 Total</div>`;
}

function escHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escJs(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function render() {
  renderYearSelect();
  renderViewTabs();
  renderMonthTabs();
  renderCatTabs();
  document.getElementById('addrow-bar').style.display = (view==='auxiliar' && currentCat!=='__total') ? '' : 'none';

  const sub = document.getElementById('toolbar-sub');
  if (view === 'campanas') sub.textContent = `${MESES[currentMonth]} ${currentYear} · Ingresos y derivaciones por campaña, día a día`;
  else if (view === 'auxiliar') sub.textContent = `${MESES[currentMonth]} ${currentYear} · Conteo diario por auxiliar`;
  else sub.textContent = `${currentYear} · Total mensual por auxiliar (calculado solo, sumando los días cargados)`;

  const hint = document.getElementById('hint');
  if (view === 'campanas') hint.innerHTML = '💡 Cargá los números tal cual la planilla original: por campaña y por día. El total del mes se calcula solo a la derecha.';
  else if (view === 'auxiliar') hint.innerHTML = '💡 Elegí la categoría arriba y cargá el conteo de cada auxiliar, día por día. La pestaña 🟢 Total suma las 9 categorías automáticamente.';
  else hint.innerHTML = '💡 Esta vista no se edita: junta, para cada auxiliar, el total de días cargados en cada mes del año. Cambiá de categoría arriba (o dejá 🟢 Total) para ver otro recorte.';

  if (view === 'campanas') renderCampanas();
  else if (view === 'auxiliar') renderAuxiliarDiario();
  else renderResumenAnual();
}

function renderCampanas() {
  const nd = diasEnMes(currentYear, currentMonth);
  const rowData = ensureCampanasMonth(currentYear, currentMonth);
  const thead = document.getElementById('thead-row');
  const tbody = document.getElementById('tbody');
  const tfoot = document.getElementById('tfoot-row');

  thead.innerHTML = `<th class="th-name">Campaña</th>` + Array.from({length:nd},(_,i)=>`<th>${i+1}</th>`).join('') + `<th class="th-total">Total</th>`;

  tbody.innerHTML = FILAS_CAMPANAS.map(f => {
    const arr = rowData[f.key];
    const total = sumArr(arr);
    const cells = arr.map((v,i)=>`<td class="td-cell"><input type="number" min="0" value="${v||''}" placeholder="—" onchange="setCampanaValor('${f.key}',${i},this.value)"></td>`).join('');
    const nameStyle = f.bold ? 'font-weight:800;font-size:12.5px;color:var(--impulsa-md);' : '';
    const rowClass = f.bold && f.indent === 0 ? ' class="fila-campana"' : '';
    return `<tr${rowClass}><td class="td-name indent-${f.indent}" style="${nameStyle}">${escHtml(f.label)}</td>${cells}<td class="td-cell td-rowtotal"><input type="text" value="${total||''}" readonly></td></tr>`;
  }).join('');

  tfoot.innerHTML = `<td class="td-name">—</td>` + Array.from({length:nd}).map(()=>'<td></td>').join('') + `<td></td>`;
}
function setCampanaValor(rowKey, dayIdx, val) {
  const rowData = ensureCampanasMonth(currentYear, currentMonth);
  rowData[rowKey][dayIdx] = Math.max(0, parseInt(val)||0);
  saveAllToStorage();
  pushCampanaRow(currentYear, currentMonth, rowKey);
  render();
}

function renderAuxiliarDiario() {
  const nd = diasEnMes(currentYear, currentMonth);
  const isTotal = currentCat === '__total';
  const q = document.getElementById('search').value.trim().toLowerCase();
  const thead = document.getElementById('thead-row');
  const tbody = document.getElementById('tbody');
  const tfoot = document.getElementById('tfoot-row');

  thead.innerHTML = `<th class="th-name">Auxiliar</th>` + Array.from({length:nd},(_,i)=>`<th>${i+1}</th>`).join('') + `<th class="th-total">Total</th>`;

  const catsParaSumar = isTotal ? CATEGORIAS.map(c=>c.id) : [currentCat];
  const rosterFiltrado = roster.filter(n => !q || n.toLowerCase().includes(q));
  const dayTotals = new Array(nd).fill(0);
  let grandTotal = 0;

  tbody.innerHTML = rosterFiltrado.map(nombre => {
    const sums = new Array(nd).fill(0);
    catsParaSumar.forEach(catId => {
      const catData = ensureAuxMonth(currentYear, currentMonth, catId);
      (catData[nombre]||[]).forEach((v,i)=> sums[i]+=(parseInt(v)||0));
    });
    const rowTotal = sums.reduce((a,b)=>a+b,0);
    sums.forEach((v,i)=>dayTotals[i]+=v);
    grandTotal += rowTotal;

    const cells = sums.map((v,i)=> isTotal
      ? `<td class="td-cell readonly clickable" onclick="showBreakdown('${escJs(nombre)}',${i})" title="Ver de qué categorías sale este total"><input type="text" value="${v||''}" readonly tabindex="-1"></td>`
      : `<td class="td-cell"><input type="number" min="0" value="${v||''}" placeholder="—" onchange="setAuxValor('${escJs(nombre)}',${i},this.value)"></td>`
    ).join('');

    const nameCell = isTotal
      ? `<td class="td-name"><div class="row-inner">${escHtml(nombre)}</div></td>`
      : `<td class="td-name"><div class="row-inner"><input type="text" value="${escHtml(nombre)}" onchange="renombrarAuxiliar('${escJs(nombre)}',this.value)"></div></td>`;
    const delCell = `<td class="td-del"><button type="button" title="Quitar auxiliar" onclick="quitarAuxiliar('${escJs(nombre)}')">×</button></td>`;

    return `<tr>${nameCell}${cells}<td class="td-cell td-rowtotal"><input type="text" value="${rowTotal||''}" readonly></td>${delCell}</tr>`;
  }).join('');

  tfoot.innerHTML = `<td class="td-name">Total</td>` + dayTotals.map(v=>`<td>${v||'—'}</td>`).join('') + `<td class="td-grandtotal">${grandTotal||'—'}</td><td></td>`;
}
function setAuxValor(nombre, dayIdx, val) {
  const catData = ensureAuxMonth(currentYear, currentMonth, currentCat);
  if (!catData[nombre]) catData[nombre] = new Array(diasEnMes(currentYear,currentMonth)).fill(0);
  catData[nombre][dayIdx] = Math.max(0, parseInt(val)||0);
  saveAllToStorage();
  pushAuxRow(currentYear, currentMonth, currentCat, nombre);
  render();
}

// ── Modal de desglose: qué categorías componen el total de un día ──
function showBreakdown(nombre, dayIdx) {
  const rows = CATEGORIAS.map(c => {
    const catData = ensureAuxMonth(currentYear, currentMonth, c.id);
    const v = (catData[nombre] || [])[dayIdx] || 0;
    return { label: `${c.icon} ${c.label}`, v };
  });
  const total = rows.reduce((a, r) => a + r.v, 0);
  const itemsHTML = rows.map(r => `<div class="bd-row ${r.v ? '' : 'bd-zero'}"><span>${r.label}</span><span>${r.v || '—'}</span></div>`).join('');
  document.getElementById('bd-title').textContent = `${nombre} — día ${dayIdx + 1} de ${MESES[currentMonth]} ${currentYear}`;
  document.getElementById('bd-body').innerHTML = itemsHTML;
  document.getElementById('bd-total').textContent = `Total: ${total}`;
  document.getElementById('breakdown-modal').classList.add('show');
}
function closeBreakdown() { document.getElementById('breakdown-modal').classList.remove('show'); }

function renderResumenAnual() {
  const isTotal = currentCat === '__total';
  const q = document.getElementById('search').value.trim().toLowerCase();
  const thead = document.getElementById('thead-row');
  const tbody = document.getElementById('tbody');
  const tfoot = document.getElementById('tfoot-row');

  thead.innerHTML = `<th class="th-name">Auxiliar</th>` + MESES_CORTO.map(m=>`<th>${m}</th>`).join('') + `<th class="th-total">Total año</th>`;

  const catsParaSumar = isTotal ? CATEGORIAS.map(c=>c.id) : [currentCat];
  const rosterFiltrado = roster.filter(n => !q || n.toLowerCase().includes(q));
  const monthTotals = new Array(12).fill(0);
  let grandTotal = 0;

  tbody.innerHTML = rosterFiltrado.map(nombre => {
    const monthSums = new Array(12).fill(0);
    for (let m=0; m<12; m++) {
      catsParaSumar.forEach(catId => {
        const catData = ensureAuxMonth(currentYear, m, catId);
        monthSums[m] += sumArr(catData[nombre]);
      });
    }
    const rowTotal = monthSums.reduce((a,b)=>a+b,0);
    monthSums.forEach((v,i)=>monthTotals[i]+=v);
    grandTotal += rowTotal;
    const cells = monthSums.map(v=>`<td class="td-cell readonly"><input type="text" value="${v||''}" readonly></td>`).join('');
    const delCell = `<td class="td-del"><button type="button" title="Quitar auxiliar" onclick="quitarAuxiliar('${escJs(nombre)}')">×</button></td>`;
    return `<tr><td class="td-name"><div class="row-inner">${escHtml(nombre)}</div></td>${cells}<td class="td-cell td-rowtotal"><input type="text" value="${rowTotal||''}" readonly></td>${delCell}</tr>`;
  }).join('');

  tfoot.innerHTML = `<td class="td-name">Total</td>` + monthTotals.map(v=>`<td>${v||'—'}</td>`).join('') + `<td class="td-grandtotal">${grandTotal||'—'}</td><td></td>`;
}

function renombrarAuxiliar(viejo, nuevo) {
  nuevo = nuevo.trim();
  if (!nuevo || nuevo === viejo) { render(); return; }
  const idx = roster.indexOf(viejo);
  if (idx === -1) return;
  roster[idx] = nuevo;
  Object.keys(auxData).forEach(y => Object.keys(auxData[y]).forEach(m => Object.keys(auxData[y][m]).forEach(c => {
    if (auxData[y][m][c][viejo]) { auxData[y][m][c][nuevo] = auxData[y][m][c][viejo]; delete auxData[y][m][c][viejo]; }
  })));
  saveAllToStorage();
  pushMeta('roster', roster);
  renameAuxInSupabase(viejo, nuevo);
  render();
}
function quitarAuxiliar(nombre) {
  if (!confirm(`¿Quitar a "${nombre}" de la lista? (no se borran sus números guardados, solo deja de aparecer)`)) return;
  roster = roster.filter(n => n !== nombre);
  saveAllToStorage();
  pushMeta('roster', roster);
  render();
}
function addAuxiliar() {
  const nombre = (prompt('Nombre del auxiliar (ej: "Apellido, Nombre"):') || '').trim();
  if (!nombre) return;
  if (roster.includes(nombre)) { alert('Ya está en la lista.'); return; }
  roster.push(nombre);
  roster.sort((a,b)=>a.localeCompare(b,'es'));
  saveAllToStorage();
  pushMeta('roster', roster);
  render();
}

function saveNow() {
  saveAllToStorage();
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

async function exportXLSX() {
  const btn = event && event.target;
  const oldLabel = btn ? btn.textContent : null;
  if (btn) { btn.textContent = '⏳ Generando...'; btn.disabled = true; }

  try {
    const wb = new ExcelJS.Workbook();
    wb.creator = 'Organización Colaboradores — Jerárquicos Salud';
    wb.created = new Date();

    const NAVY = 'FF1A2340', BLUE = 'FF5B9BD5', BLUE_LT = 'FFEAF4FB', GREY_LT = 'FFF3F5FA', WHITE='FFFFFFFF';

    for (let m = 0; m < 12; m++) {
      const nd = diasEnMes(currentYear, m);
      const sheet = wb.addWorksheet(MESES[m], { views: [{ state: 'frozen', xSplit: 1, ySplit: 1 }] });

      sheet.getColumn(1).width = 27;
      for (let d = 1; d <= nd; d++) sheet.getColumn(d + 1).width = 6.5;
      sheet.getColumn(nd + 2).width = 9;

      // Encabezado de días
      const headerRow = sheet.addRow(['Día', ...Array.from({ length: nd }, (_, i) => i + 1), 'TOTAL']);
      headerRow.eachCell(c => {
        c.font = { bold: true, color: { argb: WHITE }, size: 9 };
        c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: NAVY } };
        c.alignment = { horizontal: 'center', vertical: 'middle' };
      });
      headerRow.height = 20;

      // ── Resumen de campañas ──
      const campData = ensureCampanasMonth(currentYear, m);
      FILAS_CAMPANAS.forEach(f => {
        const arr = campData[f.key];
        const total = sumArr(arr);
        const row = sheet.addRow([f.label, ...arr.map(v => v || null), total || null]);
        row.getCell(1).alignment = { indent: f.indent * 2 };
        if (f.bold) row.getCell(1).font = { bold: true };
        for (let c = 2; c <= nd + 2; c++) row.getCell(c).alignment = { horizontal: 'center' };
        row.getCell(nd + 2).font = { bold: true, color: { argb: '47799F' } };
      });

      sheet.addRow([]);

      // ── Por auxiliar, por categoría (solo quienes tienen algo cargado ese mes) ──
      CATEGORIAS.forEach(cat => {
        const catData = ensureAuxMonth(currentYear, m, cat.id);
        const nombresConDatos = roster.filter(n => sumArr(catData[n]) > 0);
        if (!nombresConDatos.length) return;

        const catRow = sheet.addRow([`${cat.icon} ${cat.label}`]);
        catRow.getCell(1).font = { bold: true, color: { argb: WHITE } };
        catRow.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: BLUE } };

        nombresConDatos.forEach(nombre => {
          const arr = catData[nombre];
          const total = sumArr(arr);
          const row = sheet.addRow([nombre, ...arr.map(v => v || null), total || null]);
          for (let c = 2; c <= nd + 2; c++) row.getCell(c).alignment = { horizontal: 'center' };
          row.getCell(nd + 2).font = { bold: true, color: { argb: '47799F' } };
          row.getCell(nd + 2).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: BLUE_LT } };
        });
        sheet.addRow([]);
      });
    }

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Estadisticas_Emails_${currentYear}.xlsx`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  } catch (err) {
    alert('Hubo un problema generando el Excel: ' + err.message);
    console.error(err);
  } finally {
    if (btn) { btn.textContent = oldLabel; btn.disabled = false; }
  }
}

render(); // primer pintado con lo que haya en localStorage/seed, para que no quede en blanco
loadAllFromSupabase().then(cargoDeNube => { if (cargoDeNube) render(); }); // si hay datos en Supabase, repinta con eso
