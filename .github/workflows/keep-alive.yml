name: Keep Supabase alive

on:
  schedule:
    - cron: '0 8 * * 4'   # todos los jueves a las 08:00 UTC (los lunes ya los cubre Organización de tareas)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Ping Supabase (mantiene el proyecto activo)
        run: |
          curl -s "https://vadqwxrbonrbohvbeqdo.supabase.co/rest/v1/campanas_mensual?select=year&limit=1" \
            -H "apikey: sb_publishable_8oUx8EJHl67PKy2gIJYvWA_wjX9AhDe"

      - name: Dejar un rastro de actividad en el repo
        # Un cron sin commits en el repo durante 60 días queda desactivado por GitHub, en silencio.
        # Este paso hace un commit chiquito cada vez que corre, así el repo nunca pasa 60 días "quieto"
        # y el propio keep-alive no termina apagándose solo.
        run: |
          mkdir -p keepalive
          date -u +"Último ping: %Y-%m-%d %H:%M UTC" > keepalive/last-ping.txt
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add keepalive/last-ping.txt
          if git diff --cached --quiet; then
            echo "Sin cambios, no hace falta commitear."
          else
            git commit -m "keep-alive: $(date -u +'%Y-%m-%d')"
            git push
          fi
