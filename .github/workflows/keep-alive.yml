name: Keep Supabase alive + Respaldo

on:
  schedule:
    - cron: '0 8 * * 4'   # todos los jueves a las 08:00 UTC (los lunes ya los cubre Organización de tareas)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Respaldo de Supabase (esto ya cuenta como actividad y evita el auto-pausado)
        run: node scripts/backup-supabase.mjs

      - name: Commitear cambios si hay
        run: |
          date -u +"Último ping: %Y-%m-%d %H:%M UTC" > keepalive/last-ping.txt
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add keepalive/last-ping.txt backups/
          if git diff --cached --quiet; then
            echo "Sin cambios, no hace falta commitear."
          else
            git commit -m "keep-alive + respaldo: $(date -u +'%Y-%m-%d')"
            git push
          fi
