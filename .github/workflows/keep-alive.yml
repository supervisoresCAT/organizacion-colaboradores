name: Keep Supabase alive + Respaldo

on:
  schedule:
    - cron: '30 18 * * *'   # todos los días 15:30 hora argentina
    - cron: '30 2 * * *'    # todos los días 23:30 hora argentina
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: respaldo
  cancel-in-progress: false

jobs:
  keepalive-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Respaldo de Supabase (esto ya cuenta como actividad y evita el auto-pausado)
        id: respaldo
        continue-on-error: true
        run: node scripts/backup-supabase.mjs

      - name: Commitear lo respaldado
        if: always()
        run: |
          mkdir -p keepalive
          date -u +"Último ping: %Y-%m-%d %H:%M UTC" > keepalive/last-ping.txt
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add keepalive/last-ping.txt backups/
          if git diff --cached --quiet; then
            echo "Sin cambios, no hace falta commitear."
          else
            git commit -m "keep-alive + respaldo: $(date -u +'%Y-%m-%d %H:%M')"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi

      - name: Avisar si el respaldo detectó un problema
        if: steps.respaldo.outcome == 'failure'
        run: |
          echo "::error::El respaldo detectó un problema (posible pérdida de datos o Supabase sin responder). Revisar el log del paso 'Respaldo de Supabase'."
          exit 1
